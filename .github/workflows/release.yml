name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

# fork 策略：本 fork 只发布 Windows x86_64。
#
# 上游会构建 7 个平台（Linux x86_64/aarch64、macOS aarch64/x86_64、Windows
# x86_64/aarch64、FreeBSD x86_64）。对本 fork 来说那是纯浪费：FreeBSD 走 QEMU
# 虚拟机（超时上限 180 分钟），而最终 release 作业必须等它结束才会把 release
# 转正，于是"只要一个 Windows 包"也要等最坏 3 小时，还可能被无关平台的偶发
# 失败拖成永久 draft。
#
# 因此这里只保留 Windows x86_64 一条链路：单一构建作业 + 签名 + 校验和 +
# 发布。预期端到端约 15–20 分钟。
#
# 如需恢复某个平台，从上游 release.yml 取回对应作业并在 needs 里加回即可。
jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Render a human-readable changelog for the release body: changelog/v<version>.json
      # when present, otherwise grouped commit subjects since the previous tag,
      # always ending with the compare link.
      - name: Generate release notes
        run: scripts/generate_release_notes.sh "${GITHUB_REF_NAME}" > release_notes.md

      - name: Create draft release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if ! gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md; then
              sleep 2
              gh release view "${GITHUB_REF_NAME}" >/dev/null
            fi
          fi
          gh release edit "${GITHUB_REF_NAME}" --notes-file release_notes.md

  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    needs: create-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true
        id: sccache

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
          cache-all-crates: "true"

      - name: Build release binary
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --start-server *> $null
            if ($LASTEXITCODE -eq 0) {
              $env:RUSTC_WRAPPER = "sccache"
            }
          }

          & cargo build --locked --profile release-lto --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release build failed"
          }
        env:
          JCODE_RELEASE_BUILD: "1"
          JCODE_BUILD_SEMVER: ${{ github.ref_name }}

      - name: Verify built Windows binary launches
        shell: pwsh
        run: |
          & "target/x86_64-pc-windows-msvc/release-lto/jcode.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "Built Windows binary failed to run --version"
          }

      # 必达门禁：用真实产物跑一遍安装器全流程（隔离的文件系统 profile）。
      - name: Verify Windows installer with the release artifact
        shell: pwsh
        run: |
          & ./.github/scripts/verify_windows_install.ps1 `
            -ArtifactExePath "target/x86_64-pc-windows-msvc/release-lto/jcode.exe" `
            -Version "${{ github.ref_name }}"

      - name: Stage unsigned binary for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release-lto/jcode.exe" "dist/jcode-windows-x86_64.exe"

      - name: Upload unsigned binary for signing
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-x86_64
          path: dist/jcode-windows-x86_64.exe

  publish-windows:
    name: Sign and publish Windows asset
    runs-on: windows-latest
    needs: [create-release, build-windows]
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
      WINDOWS_SIGNING_CERTIFICATE_PROFILE: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE }}
    steps:
      - name: Download unsigned Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-unsigned-x86_64
          path: artifacts

      - name: Determine signing mode
        id: signing
        shell: pwsh
        run: |
          $requiredValues = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID,
            $env:WINDOWS_SIGNING_ENDPOINT,
            $env:WINDOWS_SIGNING_ACCOUNT,
            $env:WINDOWS_SIGNING_CERTIFICATE_PROFILE
          )
          $configured = -not ($requiredValues | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          "enabled=$($configured.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # fork 策略：签名是可选增强，不是发布门槛：未配置 Azure Artifact Signing 时发布
          # 未签名二进制，代价是首次运行出现 SmartScreen 警告。日后配齐即自动
          # 变成签名发布，无需再改 workflow。
          if ($configured) {
            Write-Host 'Windows signing is configured; the asset will be Authenticode-signed.'
          } else {
            Write-Warning 'Publishing an unsigned Windows asset: Azure Artifact Signing is not configured. Windows SmartScreen will warn on first run.'
            "#### Windows asset is unsigned`n`nAzure Artifact Signing is not configured, so this release ships an unsigned Windows binary. Windows SmartScreen will warn on first run." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Azure login with GitHub OIDC
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign the Windows binary
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\artifacts\jcode-windows-x86_64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature and package the asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $source = (Resolve-Path -LiteralPath 'artifacts/jcode-windows-x86_64.exe').Path

          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            $signature = Get-AuthenticodeSignature -LiteralPath $source
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed: $($signature.Status) $($signature.StatusMessage)"
            }
            Write-Host "Signed by: $($signature.SignerCertificate.Subject)"
          }

          Copy-Item -LiteralPath $source -Destination 'dist/jcode-windows-x86_64.exe' -Force
          tar -czf 'dist/jcode-windows-x86_64.tar.gz' -C dist 'jcode-windows-x86_64.exe'

      - name: Upload final Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jcode-windows-x86_64
          path: |
            dist/jcode-windows-x86_64.exe
            dist/jcode-windows-x86_64.tar.gz

      - name: Publish Windows assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${env:GITHUB_REF_NAME}" `
            dist/jcode-windows-x86_64.exe `
            dist/jcode-windows-x86_64.tar.gz `
            --clobber

  release:
    name: Finalize release
    needs: [create-release, publish-windows]
    if: ${{ always() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
          pattern: jcode-*

      - name: Validate required asset set
        shell: bash
        run: |
          set -euo pipefail

          # fork 策略：Windows x86_64 是唯一必达资产：缺失则保持 draft，不发布半成品。
          required=(
            artifacts/jcode-windows-x86_64/jcode-windows-x86_64.exe
            artifacts/jcode-windows-x86_64/jcode-windows-x86_64.tar.gz
          )

          missing=()
          for asset in "${required[@]}"; do
            if [ ! -f "$asset" ]; then
              missing+=("$asset")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required release asset: %s\n' "${missing[@]}" >&2
            echo "Keeping the release as a draft: the required Windows x86_64 asset is missing" >&2
            exit 1
          fi
          printf 'Required assets present: %s\n' "${#required[@]}"

      - name: Attach the Windows asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            artifacts/jcode-windows-x86_64/jcode-windows-x86_64.exe \
            artifacts/jcode-windows-x86_64/jcode-windows-x86_64.tar.gz \
            --clobber

      - name: Generate checksums
        shell: bash
        run: |
          bash scripts/generate_checksums.sh artifacts SHA256SUMS --recursive
          cat SHA256SUMS

      - name: Upload checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber

      - name: Add platform availability to release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json body --jq .body > release_notes.md
          python3 - << 'PY'
          import re
          from pathlib import Path

          path = Path("release_notes.md")
          body = path.read_text(encoding="utf-8")
          start = "<!-- jcode-platform-availability:start -->"
          end = "<!-- jcode-platform-availability:end -->"
          body = re.sub(
              rf"\n?{re.escape(start)}.*?{re.escape(end)}\n?",
              "\n",
              body,
              flags=re.DOTALL,
          ).rstrip()

          availability = "\n".join(
              [
                  start,
                  "## Platform availability",
                  "",
                  "- Windows x86_64: available",
                  "",
                  "This fork publishes the Windows x86_64 build only.",
                  end,
              ]
          )
          path.write_text(f"{body}\n\n{availability}\n", encoding="utf-8")
          PY
          gh release edit "${GITHUB_REF_NAME}" --notes-file release_notes.md

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          else
            echo "Release ${GITHUB_REF_NAME} is already public; leaving it public."
          fi

      # fork: 发布后自检。重新下载已公开的产物、核对 SHA256SUMS 与实际内容，
      # 捕捉“上传阶段损坏”这类在生成校验和时还看不出来的问题。
      # 用 continue-on-error：自检失败不应把已公开的 release 变成红卡，
      # 但它会在日志里留下明确信号（步骤失败 + 逐项输出的断言）。
      - name: Verify the published release (self-check)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/verify-release.sh "${GITHUB_REF_NAME}"
